body{margin:0;font:700 15px/1.4 Nunito,system-ui,sans-serif;color:var(--k);background:repeating-linear-gradient(45deg,transparent 0 13px,rgba(11,143,77,.05) 13px 14px),radial-gradient(120% 60% at 50% 0,#fff,var(--bg));padding-bottom:84px}
#app{max-width:640px;margin:auto;padding:12px}
#pie{max-width:640px;margin:0 auto;padding:4px 16px 100px;text-align:center;font:700 12px/1.4 Nunito,system-ui,sans-serif;color:#4a5057}
header{display:flex;gap:12px;align-items:center;background:var(--ch);border:1px solid #aab0b6;border-radius:16px;padding:10px 14px;box-shadow:0 1px 0 #fff inset,0 6px 16px rgba(20,22,26,.12)}

header b{display:block;font:21px/1.1 var(--slab)}header small{font-weight:800;color:#3b4046}
.val{position:relative;overflow:hidden;background:radial-gradient(circle at 50% 0,#2e2515,#0b0b0c 70%);border:2px solid var(--g);outline:2px solid #0b0b0c;outline-offset:-6px;color:var(--g2);text-align:center;font:18px var(--slab);letter-spacing:1px;padding:16px 8px;border-radius:14px;margin:12px 0}
.val span{display:block;font-size:46px;line-height:1.1;background:linear-gradient(#fff3b0,#f5d76e 45%,#b8860b);-webkit-background-clip:text;background-clip:text;color:transparent}
.val.hero::after{content:"";position:absolute;top:0;bottom:0;width:40%;left:-60%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.35),transparent);transform:skewX(-20deg)}

.esc{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:0 0 12px}
.esc i{font-style:normal;background:#fff;border:1px solid #c5cad0;border-radius:999px;padding:4px 10px;font-size:13px}.esc i b{color:var(--v)}
.esc u{flex-basis:100%;text-align:center;text-decoration:none;background:var(--k);color:var(--g2);border-radius:10px;padding:7px;font-size:14px}
.prs{display:grid;gap:10px;margin:12px 0}
.pr{display:flex;gap:12px;align-items:center;background:#fff;border-radius:14px;padding:12px 14px;border-left:10px solid var(--c);box-shadow:0 4px 12px rgba(20,22,26,.1)}
.pr:nth-child(1){--c:var(--c1)}.pr:nth-child(2){--c:var(--c2)}.pr:nth-child(3){--c:var(--c3)}.pr:nth-child(4){--c:var(--c4)}
.pr i{font-style:normal;font-size:26px}.pr b{display:block;font:30px/1 var(--slab)}.pr span{display:block;font-size:13px;color:var(--v)}.pr small{display:block;font-size:13px;color:#4a5057}
.pr em{display:inline-block;margin-top:4px;font-style:normal;font-size:12px;background:color-mix(in srgb,var(--c) 20%,#fff);border:1px solid var(--c);border-radius:999px;padding:2px 10px}
.card{background:var(--str) top/100% 5px no-repeat,#fff;border-radius:16px;padding:18px 14px 14px;margin:12px 0;box-shadow:0 4px 14px rgba(20,22,26,.09)}
.txt{white-space:pre-wrap;font:13px/1.5 Nunito,sans-serif;background:#fffbe6;border-left:4px solid var(--g);border-radius:8px;padding:10px}
button{font:800 15px Nunito,system-ui,sans-serif;border:0;border-radius:12px;padding:12px;cursor:pointer;background:var(--k);color:var(--g2)}button:active{transform:scale(.97)}
button.big{width:100%;font:19px var(--slab);padding:16px;background:linear-gradient(var(--g2),var(--g));color:#1a1405;box-shadow:0 4px 0 #8a650c}
button.v{background:var(--v);color:#fff}button.r{background:#b3261e;color:#fff}button.s{padding:6px 8px;font-size:12px;margin:2px}button:disabled{opacity:.4}
button:focus-visible,input:focus-visible{outline:3px solid var(--c4);outline-offset:2px}
.row{display:flex;gap:8px}.row>*{flex:1}
.num{font:32px var(--slab);letter-spacing:4px;text-align:center;background:#0b0b0c;color:var(--g2);border-radius:12px;padding:10px 4px;border:3px solid #0b0b0c;cursor:pointer}
.num.act{border-color:var(--g2);box-shadow:0 0 14px var(--g)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:8px 0}.pad button{font-size:22px;background:var(--ch);color:#14161a;border:1px solid #9aa1a8}
.wheel{width:96px;height:96px;border-radius:50%;margin:6px auto;background:radial-gradient(circle,#fff 0 34%,transparent 35%),conic-gradient(var(--c1) 0 25%,var(--c2) 0 50%,var(--c3) 0 75%,var(--c4) 0);border:6px solid #14161a;display:flex;align-items:center;justify-content:center;font-size:32px}
.ok{color:var(--v);font:800 14px Nunito}.warn{color:#9a5b00;font:800 14px Nunito}.bad{color:#b3261e;font:800 14px Nunito}
.err{background:#b3261e;color:#fff;padding:10px;border-radius:10px;margin:8px 0;font:800 14px Nunito}
.st{display:flex;gap:3px;margin:8px 0}.st div{flex:1;text-align:center;font:800 11px Nunito;padding:6px 0;background:#e3e6e9;border-radius:6px}.st .on{background:var(--v);color:#fff}.st .nx{background:var(--g2)}
.bar{position:fixed;left:0;right:0;bottom:0;background:#0b0b0c;border-top:3px solid var(--g);color:var(--g2);display:flex;justify-content:space-between;align-items:center;padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));font:800 15px Nunito;z-index:9}.bar button{background:linear-gradient(var(--g2),var(--g));color:#1a1405}

.bol{position:relative;background:#fff;border:2px solid #c5cad0;border-radius:16px;padding:0 0 10px;margin:12px 0;text-align:center;overflow:hidden;box-shadow:0 4px 14px rgba(20,22,26,.1)}
.bol::before{content:"";display:block;height:7px;background:var(--str)}
.bol .n{font:30px var(--slab);letter-spacing:3px;padding:10px 8px 4px}

.bn{display:flex;justify-content:center;gap:10px;margin:12px 0 6px}.bn span{font:32px var(--slab);letter-spacing:3px;background:#0b0b0c;color:var(--g2);border-radius:10px;padding:6px 12px}
.bm{margin:4px 8px}.bm2{font-size:11px;color:#4a5057;margin:6px 10px}
.pill{display:inline-block;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:800;color:#fff;background:#6b7280}.p-PAGADA{background:var(--v)}.p-SEPARADA{background:#9a5b00}.p-PERDIDA{background:#b3261e}

small{font:12px Nunito}a{color:var(--c4)}

.pn{display:block;font:26px var(--slab);margin-top:6px}

async function rpc(f,b){
  if(!SB_URL||!SB_KEY) throw new Error("Falta configurar SB_URL y SB_KEY al inicio del JavaScript.");
  let r; try{r=await fetch(SB_URL+"/rest/v1/rpc/"+f,{method:"POST",headers:{apikey:SB_KEY,...(SB_KEY.startsWith("eyJ")?{Authorization:"Bearer "+SB_KEY}:{}),"Content-Type":"application/json"},body:JSON.stringify(b||{})});}
  catch(e){throw new Error("Sin conexión con el servidor (Supabase).");}
  const j=await r.json().catch(()=>null); if(!r.ok) throw new Error((j&&j.message)||"Error del servidor"); return j;
}

function home(){
  return `${hero()}${prox()}${finalidad()}${avance()}${rapida()}${escala()}
  
  <div class=card><div class=txt>${fmt(TEXTO)}</div><p><small>${NOTA}</small></p>${CAPICUA_PAGA_AMBOS?`<p><small>${CAPICUA_TXT}</small></p>`:""}</div>
  ${S.req?`<div class=aviso>🔒 Juego privado: para participar necesitas el <b>código de invitación</b> que te dio el administrador. Lo pedimos al final, cuando des tus datos.</div>`:""}
  <button class=big onclick="start()">🎰 ESCOGER MIS NÚMEROS</button>
  <div class=card><b>Consulta tus boletas</b><small style="display:block;margin:4px 0">Por tu privacidad, escribe la cédula y el celular con los que hiciste el pedido.</small><input id=qc inputmode=numeric autocomplete=off placeholder="Tu número de cédula"><input id=qt inputmode=numeric autocomplete=off placeholder="Tu celular (el del pedido)"><button onclick="consulta()">CONSULTAR</button>
  ${S.lista?lista(S.lista):""}</div>
  <p style="text-align:center"><small><a href="#admin">Administrador</a></small></p>`;
}
const lista=l=>l.length?l.map(b=>`<div class=bol><div class=n>${b.n1} · ${b.n2}</div>${b.estado} · ${money(b.valor)} · pagado ${money(b.abono)}</div>`).join(""):"<p>No encontramos boletas con esos datos. Revisa la cédula y el celular.</p>";
async function consulta(){const c=document.getElementById("qc").value.trim(),t=document.getElementById("qt").value.trim();
  if(!/^\d{5,12}$/.test(c))return alert("Cédula inválida");if(!/^3\d{9}$/.test(t))return alert("Celular inválido: 10 dígitos y empieza por 3");
  try{const r=await rpc("rifa_por_cedula",{p_cedula:c,p_celular:t});
    if(r&&r.error){S.lista=null;S.err=errMsg(r.error)}else{S.lista=r.boletas;S.err=""}}catch(e){S.err=errMsg(e.message)}draw()}
async function quick(k){await loadEstado();S.cart=[];S.bad.clear();
  for(let i=0;i<k;i++){S.slot=0;S.cur=["",""];const a=rnd();S.cur[0]=a;S.slot=1;const b=rnd();S.cart.push([a,b])}
  S.cur=["",""];S.slot=0;S.want=k;S.v="pick";draw();scrollTo(0,0)}
async function start(){await loadEstado();S.v="pick";draw();scrollTo(0,0)}

// ===== ELEGIR NÚMEROS =====
function stat(i){const n=S.cur[i];if(n.length<4)return["",""];
  if(S.duros.has(n))return["bad","❌ Ocupado (pagado o con abono)"];
  if(S.cur[1-i]==n||S.cart.some(b=>b.includes(n)))return["bad","❌ Repetido en tu pedido"];
  if(S.blandos.has(n))return["warn","⚠️ Apartado sin abono: puedes usarlo, pero la otra persona lo pierde"];
  return["ok","✅ Disponible"+(cap(n)?" · 🔁 Capicúa"+(CAPICUA_PAGA_AMBOS?": gana ambos premios si es el mayor":""):"")]}
const libre=n=>!S.duros.has(n)&&!S.blandos.has(n)&&!S.cart.some(b=>b.includes(n))&&S.cur[1-S.slot]!=n;
function rnd(){const b=new Uint32Array(1);let n,t=0;do{let v;do{crypto.getRandomValues(b);v=b[0]}while(v>=4294960000);n=pad(v%1e4)}while(!libre(n)&&++t<20000);return n}
function spin(){
  if(S.spin||S.cart.length>=MAXB())return;
  S.flash="";
  const r=new Uint32Array(1);crypto.getRandomValues(r);
  const dur=1500+r[0]%2001,fin=rnd(),red=matchMedia("(prefers-reduced-motion:reduce)").matches,
    el=document.getElementById("wh"),box=document.querySelectorAll(".num")[S.slot],bt=document.getElementById("wb"),okb=document.getElementById("okb"),ss=document.getElementById("sst");
  S.spin=true;if(bt)bt.disabled=true;if(okb)okb.style.display="none";if(ss)ss.textContent="🎡 Girando…";
  document.querySelectorAll(".pad button").forEach(b=>b.disabled=true);
  if(el&&!red){S.ang+=360*Math.ceil(dur/450)+(r[0]>>>8)%360;el.style.transition="transform "+dur+"ms cubic-bezier(.12,.6,.1,1)";el.style.transform="rotate("+S.ang+"deg)"}
  const iv=red?0:setInterval(()=>{if(box)box.textContent=pad(Math.floor(Math.random()*1e4))},70);
  setTimeout(()=>{clearInterval(iv);S.spin=false;S.cur[S.slot]=fin;S.last=fin;draw()},red?300:dur)}
function sugerir(){if(S.spin)return;S.flash="";S.slot=0;S.cur[0]=rnd();S.slot=1;S.cur[1]=rnd();draw()}
function key(d){if(S.spin)return;S.flash="";let c=S.cur[S.slot];
  if(d=="C")c="";else if(d=="B")c=c.slice(0,-1);else c=c.length>=4?String(d):c+d;
  S.cur[S.slot]=c;draw()}
function okKey(){if(S.spin)return;const i=S.slot;if(S.cur[i].length<4||stat(i)[0]=="bad")return;
  if(i==0){S.slot=1;draw();return}
  if(S.cur[0].length==4&&stat(0)[0]!="bad"&&S.cart.length<MAXB())addB();else{S.slot=0;draw()}}
function setSlot(i){if(S.spin)return;S.slot=i;draw()}
function addB(){S.cart.push([S.cur[0],S.cur[1]]);S.flash="✅ Boleta "+S.cart.length+" agregada: "+S.cur[0]+" · "+S.cur[1];S.cur=["",""];S.slot=0;S.bad.clear();draw()}
function edit(i){const b=S.cart.splice(i,1)[0];S.cur=[b[0],b[1]];S.slot=0;S.bad.clear();draw()}
function del(i){S.cart.splice(i,1);draw()}
function pick(){
  const st=[stat(0),stat(1)],n=S.hoy+S.cart.length,full=S.cart.length>=MAXB();
  const c0=S.cur[0].length==4&&st[0][0]!="bad",c1=S.cur[1].length==4&&st[1][0]!="bad";
  const ready=!S.spin&&!full&&(S.slot==0?c0:(c0&&c1));
  const lit=n==0?0:((n-1)%7)+1,nx=n%7;
  const sub=S.cart.length*S.cfg.precio_base,tot=total(),r=7-(n%7||0);
  let metaTot=0;for(let k=0;k<S.want;k++)metaTot+=price(k);
  let msg=st[S.slot][1]||"Casilla "+(S.slot+1)+" activa",mc=st[S.slot][0];
  if(S.slot==1&&c1&&!c0){msg="⚠️ Revisa la casilla 1: toca el cuadro para corregirla";mc="warn"}
  const hint=full?"Llegaste al máximo de "+MAXB()+" boletas por pedido.":"Gira la rueda o escribe los 4 números en la calculadora (casilla "+(S.slot+1)+").";
  return `<div class=card><b>¿Cuántas boletas quieres hoy?</b><div class=row style="margin-top:8px">${[1,2,3,4,5,6,7].map(k=>`<button class="${S.want==k?"v":""}" onclick="S.want=${k};draw()">${k}</button>`).join("")}</div>
  <small>${S.cart.length>=S.want?"✅ Meta cumplida. Puedes agregar más o pulsar ¡LAS QUIERO!.":"Te faltan "+(S.want-S.cart.length)+" para tu meta de "+S.want+" ("+money(metaTot)+")"}</small>
  <div class=st>${[0,1,2,3,4,5,6].map(i=>`<div class="${i<lit?"on":(i==nx&&lit<7?"nx":"")}">${money(S.cfg.precio_base-S.cfg.descuento*i)}</div>`).join("")}</div>
  ${n>=7?`<small>Ciclo ${Math.floor(n/7)+1}: reinicia en ${money(S.cfg.precio_base)}</small>`:""}
  <div class=mini>🛒 Carrito: <b>${S.cart.length}</b> boleta${S.cart.length==1?"":"s"} · TOTAL <b>${money(tot)}</b></div>${S.flash?`<div class=ok style="margin-top:6px">${h(S.flash)}</div>`:""}</div>
  <div class=card><b>Boleta ${S.cart.length+1}${S.want>1?" de "+S.want:""}: 2 números de 4 cifras</b>
  <div class=row><div class="num ${S.slot==0?"act":""}" onclick="setSlot(0)">${S.cur[0]||"----"}</div><div class="num ${S.slot==1?"act":""}" onclick="setSlot(1)">${S.cur[1]||"----"}</div></div>
  <div id=sst class="${mc}">${msg}</div>
  <div class=row><div><b class=hd3 style="font-size:14px">🎡 RUEDA LA SUERTE</b><div class=wwrap><i class=ptr>▼</i><div class=wheel id=wh style="transform:rotate(${S.ang}deg)"></div><div class=wd id=wd>🍀</div></div><button class=big id=wb style="font-size:15px;padding:12px" onclick="spin()" ${S.spin||full?"disabled":""}>¡GIRA LA RUEDA!</button><small>Te da un número de 4 cifras para la casilla ${S.slot+1}</small></div>
  <div><div class=pad>${[1,2,3,4,5,6,7,8,9].map(d=>`<button onclick="key(${d})" ${S.spin?"disabled":""}>${d}</button>`).join("")}<button onclick="key('B')" ${S.spin?"disabled":""}>⌫</button><button onclick="key(0)" ${S.spin?"disabled":""}>0</button><button onclick="key('C')" ${S.spin?"disabled":""}>C</button></div></div></div>
  ${ready?`<button class="big v okb" id=okb onclick="okKey()">OK ✔ ${S.slot==0?"SIGUIENTE NÚMERO":"AGREGAR BOLETA"}</button>`:`<p style="text-align:center;margin:10px 0 0"><small>${hint}</small></p>`}
  <p><button onclick="sugerir()" ${S.spin?"disabled":""}>🎲 SUGERIR LAS 2 CASILLAS</button></p>
  <small>Puedes cambiar tus números cuantas veces quieras. Los números NO quedan bloqueados hasta que confirmes el pedido.</small></div>
  <div class="card" style="background:#000;color:var(--g2)">🔥 COMBO: 7 boletas = ${money(combo())} <small>(ahorras ${money(7*S.cfg.precio_base-combo())} frente a ${money(7*S.cfg.precio_base)})</small><br>
  <small>${n%7==0&&n>0?"":"Con una boleta más pagas solo "+money(price(S.cart.length))+". Te faltan "+r+" para completar las 7."}</small><br>
  <button class=big style="margin-top:6px" onclick="S.want=7;draw()">Quiero las 7</button></div>
  <div class=card><b>🛒 Carrito</b>${S.cart.length?S.cart.map((b,i)=>`<div style="margin:6px 0;${S.bad.has(b[0])||S.bad.has(b[1])?"color:#b3261e;":""}">Boleta ${i+1} · ${b[0]} · ${b[1]} · <b>${money(price(i))}</b> <button class="s" onclick="edit(${i})">editar</button><button class="s r" onclick="del(${i})">quitar</button></div>`).join("")+
  `<hr>Subtotal ${money(sub)}<br>Ahorro ${money(sub-tot)}<br><b>TOTAL ${money(tot)}</b><br>Separación hoy: ${money(S.cfg.separacion)} × ${S.cart.length} = ${money(S.cfg.separacion*S.cart.length)}<br>Saldo pendiente: ${money(tot-S.cfg.separacion*S.cart.length)}${S.hoy?"":"<br><small>El precio exacto se confirma con tu cédula.</small>"}`:"<br><small>Aún no has agregado boletas.</small>"}</div>
  <button onclick="view('home')">← Inicio</button>`;
}
const MAXB=()=>MAX_BOLETAS_POR_PEDIDO;

// ===== DATOS Y CONFIRMACIÓN =====
function datos(){
  if(!S.cart.length){S.v="pick";return pick()}
  return `<div class=card><b>Tus datos</b><small style="display:block;margin:4px 0 6px">Los necesita el administrador para saber quién eres y qué números elegiste.</small>
  <label class=lb for=fn>Nombre completo</label><input id=fn autocomplete=name placeholder="Ej: María Pérez Gómez" value="${h(S.form.nombre)}" oninput="S.form.nombre=this.value">
  <label class=lb for=fc>Cédula</label><input id=fc inputmode=numeric autocomplete=off placeholder="Solo números (5 a 12 dígitos)" value="${h(S.form.cedula)}" oninput="S.form.cedula=this.value" onchange="cedChange()">
  <label class=lb for=ft>Celular</label><input id=ft inputmode=numeric autocomplete=tel placeholder="10 dígitos, empieza por 3" value="${h(S.form.celular)}" oninput="S.form.celular=this.value">
  ${S.req?`<label class=lb for=fk>Código de invitación</label><input id=fk autocomplete=off autocapitalize=characters placeholder="El que te compartió el administrador" value="${h(S.form.codigo)}" oninput="S.form.codigo=this.value">`:""}
  <label class=chk><input type=checkbox id=fm ${S.form.mayor?"checked":""} onchange="S.form.mayor=this.checked"> Confirmo que soy mayor de 18 años</label>
  <div id=sum>${sum()}</div></div>
  <button class="big v" onclick="confirmar()" id=cb>CONFIRMAR PEDIDO</button><p><button onclick="view('pick')">← Volver a mis boletas</button></p>`;
}
const sum=()=>`<div class=val style="font-size:16px;padding:10px">VALOR BOLETA ${money(S.cfg.precio_base)}</div>${S.hoy?`<b>Hoy ya llevas ${S.hoy}; la siguiente vale ${money(price(0))}.</b><br>`:""}
${S.cart.map((b,i)=>`Boleta ${i+1} · ${b[0]} · ${b[1]} · ${money(price(i))}`).join("<br>")}${pagoBox(total(),S.cart.length,S.cfg.separacion)}${fechasBox()}`;
async function cedChange(){if(/^\d{5,12}$/.test(S.form.cedula)){await loadEstado(S.form.cedula);document.getElementById("sum").innerHTML=sum()}}
async function confirmar(){
  const f=S.form;if(f.nombre.trim().length<5)return alert("Escribe tu nombre completo");
  if(!/^\d{5,12}$/.test(f.cedula))return alert("Cédula inválida (solo números)");
  if(!/^3\d{9}$/.test(f.celular))return alert("Celular inválido: 10 dígitos y empieza por 3");
  if(!f.mayor)return alert("Debes confirmar que eres mayor de 18 años");
  if(S.req&&!f.codigo.trim())return alert("Escribe el código de invitación que te dio el administrador");
  document.getElementById("cb").disabled=true;
  try{S.res=await rpc("rifa_confirmar_pedido",{p_nombre:f.nombre,p_cedula:f.cedula,p_celular:f.celular,p_pares:S.cart,p_codigo:f.codigo||null});
    if(S.res&&S.res.error){const m=errMsg(S.res.error);S.res=null;document.getElementById("cb").disabled=false;return alert(m)}
    S.cart=[];S.err="";view("ok");location.hash="p-"+S.res.boletas[0].pedido_token;}
  catch(e){const m=e.message;
    if(m.startsWith("NUMERO_TOMADO:")){const t=m.split(":")[1].split(",");S.bad=new Set(t);await loadEstado(f.cedula);
      S.err="";alert("Estos números ya fueron tomados: "+t.join(", ")+". Reemplázalos (se marcan en rojo); tus demás boletas se conservan.");view("pick")}
    else{S.err=m;draw()}}
}

// ===== BOLETAS GENERADAS =====
function waMsg(p,nombre){
  const bs=p.boletas,tot=bs.reduce((a,b)=>a+b.valor,0),sep=p.sep*bs.length;
  return `Hola ${nombre||bs[0].nombre}, tu pedido de la GRAN RIFA DE PREMIOS:\nVALOR BOLETA ${money(S.cfg.precio_base)}\nEscala: ${escalaTxt()}\n\n`+
   bs.map((b,i)=>`Boleta ${i+1}: ${b.n1} · ${b.n2} — ${money(b.valor)}`).join("\n")+
   `\n\nTOTAL: ${money(tot)}\nSEPARACIÓN: ${money(p.sep)} × ${bs.length} = ${money(sep)}\nSaldo: ${money(tot-sep)}\nPaga por Nequi/Daviplata al ${TELEFONO_ADMIN} y envía el comprobante.\nTus boletas: ${location.origin+location.pathname}#p-${bs[0].pedido_token}\n\n${TEXTO}`;
}
function waAdmin(p){
  const bs=p.boletas,f=S.form,tot=bs.reduce((a,b)=>a+b.valor,0),sep=p.sep*bs.length,base=location.origin+location.pathname;
  return `Hola, soy ${bs[0].nombre}. Hice mi pedido en la GRAN RIFA DE PREMIOS 🧱\n\n`+
   `Nombre: ${bs[0].nombre}\n`+(f.cedula?`Cédula: ${f.cedula}\n`:"")+(f.celular?`Celular: ${f.celular}\n`:"")+
   `\nBOLETAS ESCOGIDAS:\n`+bs.map((b,i)=>`Boleta ${i+1}: ${b.n1} · ${b.n2} — ${money(b.valor)}`).join("\n")+
   `\n\nTOTAL: ${money(tot)}\nSeparación: ${money(p.sep)} × ${bs.length} = ${money(sep)}\nSaldo: ${money(tot-sep)}\n`+
   fechasWa()+`\n\nVoy a pagar por Nequi/Daviplata ${money(sep)} (separación) y te envío el comprobante.\nMi pedido: ${base}#p-${bs[0].pedido_token}`;
}
function waCliente(p){const bs=p.boletas,tot=bs.reduce((a,b)=>a+b.valor,0),ab=Math.min(tot,p.sep*bs.length),base=location.origin+location.pathname;
  return `🧱 *Tu comprobante – GRAN RIFA DE PREMIOS*\nHola ${bs[0].nombre}, estos son tus números:\n\n`+bs.map((b,i)=>`Boleta ${i+1}: ${b.n1} · ${b.n2} — ${money(b.valor)}`).join("\n")+
   `\n\nTOTAL: ${money(tot)}\n💜 Envía por Nequi hoy: ${money(ab)} al ${TELEFONO_ADMIN} para asegurar tus números. Saldo: ${money(tot-ab)}.`+fechasWa()+
   `\n\nTus boletas: ${base}#p-${bs[0].pedido_token}\nJuego privado entre familiares y amigos invitados por MINKARIFA. Solo mayores de 18 años. Juega con responsabilidad.`}
function waShare(){const base=location.origin+location.pathname;
  return `🏡 Estoy poniendo mi ladrillo en la GRAN RIFA DE PREMIOS: cada boleta aporta a la vivienda comunitaria. ¡Súmate! ${base}\nSolo mayores de 18 años.`}
function ok(){
  const p=S.res;if(!p)return home();const bs=p.boletas,tot=bs.reduce((a,b)=>a+b.valor,0);
  const urlAdm=`https://wa.me/57${TELEFONO_ADMIN}?text=${encodeURIComponent(bs.length?waAdmin(p):"")}`;
  const urlFam=`https://wa.me/?text=${encodeURIComponent(waShare())}`;
  return `<div class=card><b>${bs.length?"¡Ya pusiste tu ladrillo! 🧱 Pedido de "+h(bs[0].nombre):"Pedido no encontrado"}</b>${bs.map((b,i)=>`<div class=bol><div class=bh><img src="icon-512.png" alt="" onerror="this.remove()"><span>GRAN RIFA · Boleta ${i+1}</span><em>VALOR BOLETA ${money(S.cfg.precio_base)}</em></div>
  <div class=bn><span>${b.n1}</span><span>${b.n2}</span></div><div class=bm>${pill(b.estado)} <b>${money(b.valor)}</b> · pagado ${money(b.abono)}</div>
  <div class=bm2>${escalaTxt()}</div><div class=txt style="font-size:10px;text-align:left;margin:8px 10px 0">${fmt(TEXTO)}</div></div>`).join("")}
  ${pagoBox(tot,bs.length,p.sep)}${fechasBox()}<small>Los números quedaron fijos. Conserva este enlace: ${h(location.href)}</small></div>
  ${bs.length?`<div class=aviso>👉 Último paso: toca el botón verde para avisar al administrador qué boletas y números escogiste. Luego paga por Nequi o Daviplata al ${TELEFONO_ADMIN} y envía el comprobante.<br>Las boletas solo separadas no participan en el sorteo: se juegan cuando estén pagadas.</div>
  <a href="${urlAdm}" target="_blank" rel="noopener"><button class="big v">📲 ENVIAR MI PEDIDO AL ADMINISTRADOR</button></a>
  ${S.form.celular?`<p><a href="https://wa.me/57${S.form.celular}?text=${encodeURIComponent(waCliente(p))}" target="_blank" rel="noopener"><button class="big" style="font-size:16px">📩 GUARDAR MI COMPROBANTE EN MI WHATSAPP</button></a><small>Se abre tu WhatsApp con el mensaje listo (tus números, cuánto enviar y las fechas de juego). Solo toca enviar.</small></p>`:""}
  <p><a href="${urlFam}" target="_blank" rel="noopener"><button style="width:100%">👨‍👩‍👧 Invitar a mi familia por WhatsApp</button></a></p>`:""}
  <p><button onclick="S.res=null;location.hash='';view('home')">Inicio</button></p>`;
}

// ===== ADMINISTRADOR =====
let A={u:"",p:"",data:null,q:"",iv:null,cod:""};
function adm(){
  if(!A.data)return `<div class=card><b>Administrador</b><input id=au placeholder=Usuario><input id=ap type=password placeholder=Clave><button class=big onclick="aLogin()">ENTRAR</button></div><button onclick="location.hash='';view('home')">← Inicio</button>`;
  const q=A.q.toLowerCase(),rows=A.data.filter(b=>!q||[b.nombre,b.cedula,b.celular,b.n1,b.n2].join(" ").toLowerCase().includes(q));
  const pag=A.data.filter(b=>b.estado=="PAGADA").length;
  return `<div class=card><b>Panel admin</b> · ${A.data.length} boletas · ${pag} pagadas<br>
  <button onclick="aLoad()">Actualizar</button> <button onclick="aCsv()">CSV</button> <button onclick="aClave()">Cambiar clave</button> <button class=r onclick="aOut()">Salir</button>
   <div class=aviso style="margin-top:8px">🔑 Código de invitación: <b>${A.cod?h(A.cod):"(sin código: la rifa está abierta a todos)"}</b><br><button class=s onclick="aCodigo()">Cambiar código</button> ${A.cod?`<button class="s v" onclick="aEnlace()">Copiar enlace de invitación</button>`:""}</div>
  <canvas id=cv width=600 height=600 onclick="aTap(event)"></canvas><div id=tip><small>Toca una luz para ver detalles.</small></div></div>
  <input placeholder="Buscar nombre, cédula, celular o número" value="${h(A.q)}" oninput="A.q=this.value;aRows()">
  <div class=tw id=rows>${aTable(rows)}</div>`;
}
const aTable=rows=>`<table><tr><th>Pedido<th>Nombre<th>Céd.<th>Cel.<th>Números<th>Estado<th>Pagado/Pend.<th>Fecha<th>Acciones</tr>`+rows.map(b=>`<tr><td>${b.pedido_token.slice(0,5)}<td>${h(b.nombre)}<td>${b.cedula}<td>${b.celular}<td>${b.n1} ${b.n2}<td>${pill(b.estado)}<td>${money(b.abono)}/${money(b.valor-b.abono)}<td>${(b.creado||"").slice(0,10)}<td>
 <button class=s onclick="aAct('abono','boleta','${b.id}')">Abono</button><button class="s v" onclick="aAct('pagada','boleta','${b.id}')">PAGADA</button><button class="s r" onclick="if(confirm('¿Anular?'))aAct('anular','boleta','${b.id}')">ANULAR</button>
 <button class=s onclick="aAct('abono','pedido','${b.pedido_token}')">Abono pedido</button><button class="s v" onclick="aAct('pagada','pedido','${b.pedido_token}')">PAGAR PEDIDO</button>
 ${b.estado=="PERDIDA"?`<button class=s onclick="aAviso('${b.id}')">Avisar</button>`:""}</tr>`).join("")+"</table>";
function aRows(){const q=A.q.toLowerCase();document.getElementById("rows").innerHTML=aTable(A.data.filter(b=>!q||[b.nombre,b.cedula,b.celular,b.n1,b.n2].join(" ").toLowerCase().includes(q)))}
function aBoard(){const c=document.getElementById("cv");if(!c)return;const x=c.getContext("2d");x.fillStyle="#0d1f15";x.fillRect(0,0,600,600);
  A.map={};A.data.filter(b=>b.estado=="PAGADA").forEach(b=>{A.map[b.n1]=b;A.map[b.n2]=b});
  for(const n in A.map){const i=+n;x.fillStyle="#2ee66b";x.fillRect((i%100)*6+1,Math.floor(i/100)*6+1,4,4)}}
function aTap(e){const r=e.target.getBoundingClientRect(),i=Math.floor((e.clientY-r.top)/r.height*100)*100+Math.floor((e.clientX-r.left)/r.width*100),n=pad(i),b=A.map[n];
  document.getElementById("tip").innerHTML=`<b>${n}</b> · ${b?"PAGADA · "+h(b.nombre):"sin pagar"}`}
async function aLogin(){A.u=document.getElementById("au").value;A.p=document.getElementById("ap").value;await aLoad();
  clearInterval(A.iv);A.iv=setInterval(()=>S.v=="adm"&&A.data&&aLoad(1),20000)}
async function aLoad(quiet){try{const d=await rpc("rifa_admin_listar",{u:A.u,p:A.p});if(d&&d.error)throw new Error(errMsg(d.error));A.data=d;S.err="";
    const c=await rpc("rifa_admin_codigo",{u:A.u,p:A.p});A.cod=(c&&c.codigo)||"";
    if(quiet&&document.activeElement.tagName=="INPUT"){aRows();aBoard();return}draw();aBoard()}
  catch(e){A.data=null;S.err=errMsg(e.message);draw()}}
async function aAct(a,t,id){try{const r=await rpc("rifa_admin_accion",{u:A.u,p:A.p,p_accion:a,p_tipo:t,p_id:id});if(r&&r.error)return alert(errMsg(r.error));aLoad()}catch(e){alert(errMsg(e.message))}}
async function aCodigo(){const n=prompt("Código de invitación (mínimo 5 caracteres, sin espacios).\nDéjalo VACÍO para quitar el código y abrir la rifa a todos:",A.cod||"");if(n===null)return;
  try{const r=await rpc("rifa_admin_codigo",{u:A.u,p:A.p,nuevo:n.trim()});if(r&&r.error)return alert(errMsg(r.error));A.cod=r.codigo||"";draw();aBoard()}catch(e){alert(errMsg(e.message))}}
function aEnlace(){const u=location.origin+location.pathname+"#i-"+encodeURIComponent(A.cod);
  if(navigator.clipboard)navigator.clipboard.writeText(u).then(()=>alert("Enlace copiado. Compártelo solo con las personas invitadas:\n"+u),()=>prompt("Copia el enlace:",u));else prompt("Copia el enlace:",u)}
function aAviso(id){const b=A.data.find(x=>x.id==id);
  const m=`Hola ${b.nombre}, alguien tomó tus números ${b.n1} y ${b.n2} por no dejarlos separados con los ${money(S.cfg.separacion)}. Si quieres, escoge nuevos números.`;
  window.open(`https://wa.me/57${b.celular}?text=${encodeURIComponent(m)}`,"_blank")}
async function aClave(){const n=prompt("Nueva clave (mínimo 8 caracteres):");if(!n)return;
  try{const r=await rpc("rifa_admin_clave",{u:A.u,p:A.p,nueva:n});if(r&&r.error)return alert(errMsg(r.error));A.p=n;alert("Clave actualizada")}catch(e){alert(errMsg(e.message))}}
function aOut(){A.data=null;A.p="";clearInterval(A.iv);draw()}
function aCsv(){const base=location.origin+location.pathname,q=s=>'"'+String(s).replace(/"/g,'""')+'"';
  const L=[["Nombre","Cédula","Celular","Números","Estado","Valor","Pedido","Enlace"].join(";")].concat(A.data.map(b=>[q(b.nombre),q(b.cedula),q(b.celular),`="${b.n1} - ${b.n2}"`,b.estado,b.valor,b.pedido_token.slice(0,8),base+"#p-"+b.pedido_token].join(";")));
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["\ufeff"+L.join("\r\n")],{type:"text/csv;charset=utf-8"}));a.download="rifa.csv";a.click()}

// ===== ARRANQUE Y ENLACES =====
async function route(){
  const m=location.hash;
  if(m=="#admin")return view("adm");
  if(m.startsWith("#i-")){try{S.form.codigo=decodeURIComponent(m.slice(3))}catch(e){S.form.codigo=m.slice(3)}history.replaceState(null,"",location.pathname+location.search)}
  if(m.startsWith("#p-")){await loadEstado();try{S.res=await rpc("rifa_ver_pedido",{p_token:m.slice(3)});S.err=""}catch(e){S.err=e.message}return view("ok")}
  await loadEstado();draw();
}
addEventListener("hashchange",()=>{if(location.hash=="#admin"||(location.hash.startsWith("#p-")&&(!S.res||S.res.boletas[0]?.pedido_token!=location.hash.slice(3))))route()});
route();
</script></body></html>
