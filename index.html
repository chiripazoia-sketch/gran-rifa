async function rpc(f,b){
  if(!SB_URL||!SB_KEY) throw new Error("Falta configurar SB_URL y SB_KEY al inicio del JavaScript.");
  let r; try{r=await fetch(SB_URL+"/rest/v1/rpc/"+f,{method:"POST",headers:{apikey:SB_KEY,...(SB_KEY.startsWith("eyJ")?{Authorization:"Bearer "+SB_KEY}:{}),"Content-Type":"application/json"},body:JSON.stringify(b||{})});}
  catch(e){throw new Error("Sin conexión con el servidor (Supabase).");}
  const j=await r.json().catch(()=>null); if(!r.ok) throw new Error((j&&j.message)||"Error del servidor"); return j;
}

function stat(i){const n=S.cur[i];if(n.length<4)return["","",""];
  if(S.duros.has(n))return["bad","❌ Número ya comprado por otro apostador"];
  if(S.cur.some((x,j)=>j!=i&&x==n)||S.cart.some(b=>b.includes(n)))return["bad","❌ Repetido en tu pedido"];
  if(S.blandos.has(n))return["warn","⚠️ Apartado sin abono: puedes usarlo, pero la otra persona lo pierde"];
  return["ok","✅ Disponible"+(cap(n)?" · 🔁 Capicúa"+(CAPICUA_PAGA_AMBOS?": gana ambos premios si es el mayor":""):"")]}
const libre=n=>!S.duros.has(n)&&!S.blandos.has(n)&&!S.cart.some(b=>b.includes(n))&&!S.cur.some((x,j)=>j!=S.slot&&x==n);
function rnd(){const b=new Uint32Array(1);let n,t=0;do{let v;do{crypto.getRandomValues(b);v=b[0]}while(v>=4294960000);n=pad(v%1e4)}while(!libre(n)&&++t<20000);return n}

  if(S.spin||S.confirm||S.cart.length>=MAXB())return;

  const r=new Uint32Array(1);crypto.getRandomValues(r);
  const dur=1500+r[0]%2001,fin=rnd(),red=matchMedia("(prefers-reduced-motion:reduce)").matches,
    el=document.getElementById("wh"),box=document.querySelectorAll(".num")[S.slot],bt=document.getElementById("wb"),okb=document.getElementById("okb"),ss=document.getElementById("sst");
  S.spin=true;if(okb)okb.style.display="none";if(ss)ss.textContent="🎡 Girando…";
  document.querySelectorAll(".pad button").forEach(b=>b.disabled=true);
  if(el&&!red){S.ang+=360*Math.ceil(dur/450)+(r[0]>>>8)%360;el.style.transition="transform "+dur+"ms cubic-bezier(.12,.6,.1,1)";el.style.transform="rotate("+S.ang+"deg)"}
  const iv=red?0:setInterval(()=>{if(box)box.textContent=pad(Math.floor(Math.random()*1e4))},70);
  setTimeout(()=>{clearInterval(iv);S.spin=false;S.cur[S.slot]=fin;S.last=fin;adv();draw()},red?300:dur)}
function adv(){const i=S.slot;if(S.cur[i].length<4||stat(i)[0]=="bad")return;
  if(i<2)S.slot=i+1;else if(S.cur.every((x,j)=>x.length==4&&stat(j)[0]!="bad")&&S.cart.length<MAXB())S.confirm=true}

  if(d=="C")c="";else if(d=="B")c=c.slice(0,-1);else c=c.length>=4?String(d):c+d;
  S.cur[S.slot]=c;adv();draw()}

function aRestore(){try{const o=JSON.parse(sessionStorage.getItem("rifa_adm")||"null");if(o&&o.t){A.u=o.u;A.t=o.t;return true}}catch(e){}return false}
async function aRpc(f,b){const r=await rpc(f,Object.assign({u:A.u,t:A.t},b||{}));
  if(r&&r.error){if(r.error=="SESION_INVALIDA"){aClear();S.err=errMsg("SESION_INVALIDA");draw()}throw new Error(errMsg(r.error))}return r}
function adm(){
  if(!A.data)return `<div class=card><b>Administrador</b><input id=au placeholder=Usuario autocomplete=username><input id=ap type=password placeholder=Clave autocomplete=current-password><button class=big onclick="aLogin()">ENTRAR</button></div><button onclick="location.hash='';view('home')">← Inicio</button>`;
  const pag=A.data.filter(b=>b.estado=="PAGADA").length,sep=A.data.filter(b=>b.estado=="SEPARADA"&&b.abono>0).length;
  return `<div class=card><b>Panel admin</b> · ${A.data.length} boletas · ${pag} pagadas · ${sep} con abono<br>
  <button onclick="aLoad()">Actualizar</button> <button onclick="aCsv()">CSV</button> <button onclick="aAudit()">Auditoría</button> <button onclick="aClave()">Cambiar clave</button> <button class=r onclick="aOut()">Salir</button>
   <div class=aviso style="margin-top:8px">🔑 Código de invitación: <b>${A.cod?h(A.cod):"(sin código: la rifa está abierta a todos)"}</b><br><button class=s onclick="aCodigo()">Cambiar código</button> ${A.cod?`<button class="s v" onclick="aEnlace()">Copiar enlace de invitación</button>`:""}</div>
  <canvas id=cv width=600 height=600 onclick="aTap(event)"></canvas><div id=tip><small>🟩 pagada · 🟧 separada con abono. Toca una luz.</small></div></div>
  <div class=card><b>Registrar compra o separación</b>
   <input id=rn placeholder="Nombre completo"><input id=rc inputmode=numeric placeholder="Cédula"><input id=rt inputmode=numeric placeholder="Celular (3…)">
   <div class=row><input id=r1 inputmode=numeric maxlength=4 placeholder="Número 1"><input id=r2 inputmode=numeric maxlength=4 placeholder="Número 2"><input id=r3 inputmode=numeric maxlength=4 placeholder="Número 3"></div>
   <select id=rk onchange="document.getElementById('rm').style.display=this.value=='COMPRA COMPLETA'?'none':'block'" style="width:100%;font:700 20px Nunito;padding:12px;margin:4px 0"><option>COMPRA COMPLETA</option><option>SEPARACIÓN</option></select>
   <input id=rm inputmode=numeric placeholder="Monto recibido (mín. ${money(S.cfg.separacion)})" style="display:none">
   <button class="big v" onclick="aRegistrar()">REGISTRAR</button></div>
  ${A.aud?`<div class=card><b>Auditoría (últimos ${A.aud.length})</b><div class=tw><table><tr><th>Fecha<th>Usuario<th>Acción<th>Números<th>Monto<th>Detalle</tr>${A.aud.map(a=>`<tr><td>${h(String(a.fecha).replace("T"," ").slice(0,16))}<td>${h(a.usuario)}<td>${h(a.accion)}<td>${h(a.numeros||"")}<td>${a.monto==null?"":money(a.monto)}<td>${h(a.detalle||"")}</tr>`).join("")}</table></div></div>`:""}
  <input placeholder="Buscar nombre, cédula, celular o número" value="${h(A.q)}" oninput="A.q=this.value;aRows()">
  <div class=tw id=rows>${aTable(aFilt())}</div>`;
}
const aFilt=()=>{const q=A.q.toLowerCase();return A.data.filter(b=>!q||[b.nombre,b.cedula,b.celular,b.n1,b.n2,b.n3].join(" ").toLowerCase().includes(q))};
const aTable=rows=>`<table><tr><th>Pedido<th>Nombre<th>Céd.<th>Cel.<th>Números<th>Estado<th>Pagado/Pend.<th>Fecha<th>Acciones</tr>`+rows.map(b=>`<tr><td>${b.pedido_token.slice(0,5)}<td>${h(b.nombre)}<td>${b.cedula}<td>${b.celular}<td>${[b.n1,b.n2,b.n3].filter(Boolean).join(" ")}<td>${pill(b.estado)}<td>${money(b.abono)}/${money(b.valor-b.abono)}<td>${(b.creado||"").slice(0,10)}<td>
 <button class=s onclick="aAbono('${b.id}')">Abono</button><button class="s v" onclick="aAct('pagada','boleta','${b.id}')">PAGADA</button><button class="s r" onclick="if(confirm('¿Anular y liberar los números?'))aAct('anular','boleta','${b.id}')">ANULAR</button>
 ${b.estado=="SEPARADA"&&b.abono==0?`<button class=s onclick="if(confirm('¿Marcar PERDIDA?'))aAct('perdida','boleta','${b.id}')">PERDIDA</button>`:""}
 <button class=s onclick="aAct('abono','pedido','${b.pedido_token}')">Abono pedido</button><button class="s v" onclick="aAct('pagada','pedido','${b.pedido_token}')">PAGAR PEDIDO</button>
 ${b.estado=="PERDIDA"?`<button class=s onclick="aAviso('${b.id}')">Avisar</button>`:""}</tr>`).join("")+"</table>";
function aRows(){const e=document.getElementById("rows");if(e)e.innerHTML=aTable(aFilt())}
function aBoard(){const c=document.getElementById("cv");if(!c)return;const x=c.getContext("2d");x.fillStyle="#0d1f15";x.fillRect(0,0,600,600);
  A.map={};A.data.filter(b=>b.estado=="PAGADA"||(b.estado=="SEPARADA"&&b.abono>0)).forEach(b=>{A.map[b.n1]=b;A.map[b.n2]=b;if(b.n3)A.map[b.n3]=b});
  for(const n in A.map){const i=+n;x.fillStyle=A.map[n].estado=="PAGADA"?"#2ee66b":"#f2a516";x.fillRect((i%100)*6+1,Math.floor(i/100)*6+1,4,4)}}
function aTap(e){const r=e.target.getBoundingClientRect(),i=Math.floor((e.clientY-r.top)/r.height*100)*100+Math.floor((e.clientX-r.left)/r.width*100),n=pad(i),b=A.map[n];
  document.getElementById("tip").innerHTML=`<b>${n}</b> · ${b?b.estado+" · "+h(b.nombre):"libre"}`}
async function aLogin(){const u=document.getElementById("au").value.trim(),p=document.getElementById("ap").value;
  try{const r=await rpc("rifa_admin_login",{u,p});if(r&&r.error){S.err=errMsg(r.error);return draw()}
    A.u=u;A.t=r.token;aSave();S.err="";await aLoad();
    clearInterval(A.iv);A.iv=setInterval(()=>S.v=="adm"&&A.data&&aLoad(1),20000)}
  catch(e){S.err=errMsg(e.message);draw()}}
async function aLoad(quiet){try{A.data=await aRpc("rifa_admin_listar");S.err="";
    const c=await aRpc("rifa_admin_codigo");A.cod=(c&&c.codigo)||"";
    if(quiet&&document.activeElement&&document.activeElement.tagName=="INPUT"){aRows();aBoard();return}draw();aBoard()}
  catch(e){if(A.t){S.err=e.message;draw()}}}
async function aAct(a,t,id,m){try{await aRpc("rifa_admin_accion",{p_accion:a,p_tipo:t,p_id:id,p_monto:m==null?null:m});aLoad()}catch(e){alert(e.message)}}
function aAbono(id){const m=prompt("Monto del abono (vacío = "+money(S.cfg.separacion)+"):","");if(m===null)return;const v=m.trim()?parseInt(m.replace(/\D/g,""),10):null;if(m.trim()&&!(v>0))return alert("Monto inválido");aAct("abono","boleta",id,v)}
async function aRegistrar(){const g=i=>document.getElementById(i).value.trim(),k=g("rk"),m=g("rm");
  if(!confirm("¿Registrar "+k+" de "+g("rn")+" con los números "+g("r1")+", "+g("r2")+" y "+g("r3")+"?"))return;
  try{const r=await aRpc("rifa_admin_registrar",{p_nombre:g("rn"),p_cedula:g("rc"),p_celular:g("rt"),p_n1:g("r1"),p_n2:g("r2"),p_n3:g("r3"),p_tipo:k,p_monto:(k!="COMPRA COMPLETA"&&m)?parseInt(m.replace(/\D/g,""),10):null});
    alert("✅ Registrado.");await aLoad()}
  catch(e){alert(e.message)}}
async function aAudit(){try{A.aud=await aRpc("rifa_admin_auditoria",{lim:200});draw();aBoard()}catch(e){alert(e.message)}}
async function aCodigo(){const n=prompt("Código de invitación (mínimo 5 caracteres, sin espacios).\nDéjalo VACÍO para quitar el código y abrir la rifa a todos:",A.cod||"");if(n===null)return;
  try{const r=await aRpc("rifa_admin_codigo",{nuevo:n.trim()});A.cod=r.codigo||"";draw();aBoard()}catch(e){alert(e.message)}}
function aEnlace(){const u=location.origin+location.pathname+"#i-"+encodeURIComponent(A.cod);
  if(navigator.clipboard)navigator.clipboard.writeText(u).then(()=>alert("Enlace copiado. Compártelo solo con las personas invitadas:\n"+u),()=>prompt("Copia el enlace:",u));else prompt("Copia el enlace:",u)}
function aAviso(id){const b=A.data.find(x=>x.id==id);
  const m=`Hola ${b.nombre}, alguien tomó tus números ${[b.n1,b.n2,b.n3].filter(Boolean).join(", ")} por no dejarlos separados con los ${money(S.cfg.separacion)}. Si quieres, escoge nuevos números.`;
  window.open(`https://wa.me/57${b.celular}?text=${encodeURIComponent(m)}`,"_blank")}
async function aClave(){const n=prompt("Nueva clave (mínimo 8 caracteres):");if(!n)return;
  try{await aRpc("rifa_admin_clave",{nueva:n});alert("Clave actualizada. Las otras sesiones se cerraron.")}catch(e){alert(e.message)}}
async function aOut(){try{await rpc("rifa_admin_logout",{u:A.u,t:A.t})}catch(e){}aClear();A.q="";draw()}
function aCsv(){const base=location.origin+location.pathname,q=s=>'"'+String(s).replace(/"/g,'""')+'"';
  const L=[["Nombre","Cédula","Celular","Números","Estado","Valor","Abono","Saldo","Fecha","Pedido","Enlace"].join(";")].concat(A.data.map(b=>[q(b.nombre),q(b.cedula),q(b.celular),`="${[b.n1,b.n2,b.n3].filter(Boolean).join(" - ")}"`,b.estado,b.valor,b.abono,b.valor-b.abono,(b.creado||"").slice(0,10),b.pedido_token.slice(0,8),base+"#p-"+b.pedido_token].join(";")));
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["﻿"+L.join("\r\n")],{type:"text/csv;charset=utf-8"}));a.download="rifa.csv";document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500)}

// ===== ARRANQUE Y ENLACES =====
async function route(){
  const m=location.hash;
  if(m=="#admin"){if(!A.data&&aRestore()){await loadEstado();A.q="";view("adm");return aLoad()}await loadEstado();return view("adm")}
  if(m.startsWith("#i-")){try{S.form.codigo=decodeURIComponent(m.slice(3))}catch(e){S.form.codigo=m.slice(3)}history.replaceState(null,"",location.pathname+location.search)}
  if(m.startsWith("#p-")){await loadEstado();try{S.res=await rpc("rifa_ver_pedido",{p_token:m.slice(3)});S.err=""}catch(e){S.err=e.message}return view("ok")}
  await loadEstado();draw();
}
addEventListener("hashchange",()=>{if(location.hash=="#admin"||(location.hash.startsWith("#p-")&&(!S.res||S.res.boletas[0]?.pedido_token!=location.hash.slice(3))))route()});
route();
</script></body></html>
